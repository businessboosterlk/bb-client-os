<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Hub · Business Booster</title>
  <!-- ONE BUILD FOR EVERY ADDRESS. The base is the folder the page is in, so the files that were
       tested are, byte for byte, the files that are published, whatever folder they are served from. -->
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Hub">
  <meta name="bb-access" content="login">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" id="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The font never holds up the first paint: it loads as a print sheet and switches itself on. -->
  <link id="font-sheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <!-- THE SHELL, in the page itself, so the very first paint already has the right ground, the
       right theme and the installed iPhone rule. The full sheet in styles.css repeats these. -->
  <style>
    :root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bg:#f5f5f7}
    html[data-theme="dark"]{--bg:#0c0d10}
    html{min-height:calc(100% + var(--sat))}
    html,body{margin:0;background:var(--top,var(--bg))}
    body{min-height:100dvh}
    .statusfill{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--top,var(--bg));z-index:70;transform:translateY(var(--vv-top,0px));pointer-events:none}
  </style>
  <script>
    /* the theme and the ground are chosen BEFORE the first paint, so night never flashes white.
       No saved seat means the door, and the door is black. */
    (function(){ try {
      var t = localStorage.getItem('hub_theme'), dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      var d = document.documentElement; d.setAttribute('data-theme', dark ? 'dark' : 'light');
      d.style.setProperty('--top', localStorage.getItem('hub_session') ? (dark ? '#0c0d10' : '#f5f5f7') : '#08080a');
    } catch (e) {} })();
  </script>
</head>
<body>
  <div class="statusfill"></div>
  <bb-root></bb-root>
</body>
</html>
