<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Hub · Business Booster</title>
  <!-- ONE BUILD FOR EVERY ADDRESS. The base is the folder the page is in, so the files that were
       tested are, byte for byte, the files that are published, whatever folder they are served from. -->
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Hub">
  <meta name="bb-access" content="login">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" id="manifest" href="manifest.webmanifest">
  <!-- THE FONT LIVES IN THE APP. Inter (SIL Open Font Licence, the licence sits beside the files) is
       served from this site, so an installed app with no connection still has its own letters and
       nothing about a visit is sent to another company's server to fetch a font. -->
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- THE SHELL, in the page itself, so the very first paint already has the right ground, the
       right theme and the installed iPhone rule. The full sheet in styles.css repeats these. -->
  <style>
    @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format('woff2');
      unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-ext.woff2) format('woff2');
      unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    :root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bg:#f5f5f7}
    html[data-theme="dark"]{--bg:#0c0d10}
    html{min-height:calc(100% + var(--sat))}
    html,body{margin:0;background:var(--top,var(--bg))}
    body{min-height:100dvh}
    .statusfill{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--top,var(--bg));z-index:70;transform:translateY(var(--vv-top,0px));pointer-events:none}
  </style>
  <script>
    /* the theme and the ground are chosen BEFORE the first paint, so night never flashes white.
       No saved seat means the door, and the door is black. */
    (function(){ try {
      var t = localStorage.getItem('hub_theme'), dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      var d = document.documentElement; d.setAttribute('data-theme', dark ? 'dark' : 'light');
      d.style.setProperty('--top', localStorage.getItem('hub_session') ? (dark ? '#0c0d10' : '#f5f5f7') : '#08080a');
    } catch (e) {} })();
  </script>
</head>
<body>
  <div class="statusfill"></div>
  <bb-root></bb-root>
</body>
</html>
